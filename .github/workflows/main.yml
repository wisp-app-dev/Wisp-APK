name: Build Wisp APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnostic - fichiers du dépôt
        run: |
          pwd
          find . -path ./.git -prune -o -type f -print | head -50

      - name: Patch hosts.txt dans l'APK
        run: |
          BASE=$(find . -path ./.git -prune -o -iname '*.apk' -print | grep -v unsigned | head -1)
          HOSTS=$(find . -path ./.git -prune -o -name 'hosts.txt' -print | head -1)
          echo "APK de base : $BASE"
          echo "hosts.txt   : $HOSTS"
          [ -n "$BASE" ] || { echo "::error::Aucun APK de base trouvé (base/Wisp-base.apk manquant ?)"; exit 1; }
          [ -n "$HOSTS" ] || { echo "::error::hosts.txt introuvable (app/hosts.txt manquant ?)"; exit 1; }
          python3 - "$BASE" "$HOSTS" unsigned.apk <<'PY'
          import sys, zipfile
          base, hosts, out = sys.argv[1:4]
          new = open(hosts, 'rb').read()
          found = False
          with zipfile.ZipFile(base) as zin, zipfile.ZipFile(out, 'w') as zout:
              for item in zin.infolist():
                  name = item.filename
                  if name.startswith('META-INF/') and name.upper().endswith(('.SF', '.RSA', '.DSA', '.EC', '.MF')):
                      continue
                  if name == 'assets/hosts.txt':
                      data = new; found = True
                  else:
                      data = zin.read(name)
                  zout.writestr(item, data, compress_type=item.compress_type)
          if not found:
              sys.exit('assets/hosts.txt absent de l APK de base')
          print('OK ->', out)
          PY

      - name: Zipalign + signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            KS=release.keystore; PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            KS=$(find . -name 'wisp.keystore' | head -1); PASS=wisp1234; ALIAS=wisp
            [ -n "$KS" ] || { echo "::error::keystore/wisp.keystore manquant"; exit 1; }
          fi
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out Wisp.apk aligned.apk
          "$BT/apksigner" verify --verbose Wisp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-apk
          path: Wisp.apk

      - name: Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wisp (dernier build)
          files: Wisp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
